<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Obsidian Tactical Squircle Background -->
  <rect width="64" height="64" rx="14" fill="#080B10"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Radar Grid & Sweep Lines -->
  <circle cx="32" cy="32" r="23" stroke="#22D3EE" stroke-opacity="0.15" stroke-dasharray="3 3" stroke-width="1"/>
  <circle cx="32" cy="32" r="14" stroke="#D4A95A" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="32" cy="32" r="3" fill="#22D3EE" fill-opacity="0.8"/>

  <!-- Tactical Reticle Tick Marks (N, S, E, W) -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="60" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="10" y2="32" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Diagonal Sub-Crosshairs -->
  <line x1="18" y1="18" x2="22" y2="22" stroke="#D4A95A" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="46" y1="18" x2="42" y2="22" stroke="#D4A95A" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="18" y1="46" x2="22" y2="42" stroke="#D4A95A" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="46" y1="46" x2="42" y2="42" stroke="#D4A95A" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Stylized ShadowTrace Tactical Insignia (Diamond Shard "S") -->
  <path d="M38 17 H26 L20 27 H38 L44 37 H26 L20 47 H38" 
        stroke="#D4A95A" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Glowing Laser Core Points -->
  <circle cx="38" cy="17" r="1.5" fill="#FFF"/>
  <circle cx="20" cy="47" r="1.5" fill="#22D3EE"/>
</svg>
